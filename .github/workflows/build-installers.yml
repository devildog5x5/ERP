name: Build installers

on:
  workflow_dispatch:
  push:
    paths:
      - "installer/**"
      - "build_installers.ps1"
      - "src/**"
      - "Directory.Build.props"
      - ".github/workflows/build-installers.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe missing after Inno Setup install"
          }

      - name: Build all three Setup packages
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_installers.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: coalesce-installers
          path: |
            installers/CoalesceSetup.exe
            installers/CoalesceClientSetup.exe
            installers/CoalesceServerSetup.exe
          if-no-files-found: error
